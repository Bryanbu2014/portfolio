<body>

    <header class="site-header">
        <div class="container site-header__inner">
            <a href="/" class="brand" aria-label="Home">
                <span class="brand__mark" aria-hidden="true"></span>
                <span class="brand__name">Bryan Bu Wen Bin</span>
            </a>

            <nav class="site-nav" aria-label="Page">
                <a href="/#achievements" class="back-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Go Back</a>
            </nav>

            <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme">
                <i class="fas fa-moon" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main id="main">
        <article class="article-container">

            <header class="article-header">
                <h1 class="article-title">CERN GridWars Hackathon</h1>

            </header>

            <div class="article-content">
                <p>The project behind this result: <a href="/projects/grid-wars/">Grid Wars</a>.</p>

                <!-- Certificate PDFs live in assets/certificates/ (paths set on the buttons in #cert-dialog).
                     Without JS this link opens the award certificate in a new tab. -->
                <div class="cv-actions">
                    <a href="/assets/certificates/cern-gridwars-award.pdf" class="btn btn-primary" data-doc-open="cert-dialog" target="_blank" rel="noopener noreferrer">
                        <i class="fas fa-eye" aria-hidden="true"></i> View certificates
                    </a>
                </div>
            </div>
        </article>
    </main>

    <dialog id="cert-dialog" class="doc-dialog" aria-labelledby="cert-dialog-title">
        <div class="doc-dialog__bar">
            <h2 id="cert-dialog-title" class="doc-dialog__title">Hackathon Award Certificate</h2>
            <div class="doc-dialog__switch" role="group" aria-label="Certificate">
                <button type="button" data-doc-src="/assets/certificates/cern-gridwars-award.pdf" data-doc-title="Hackathon Award Certificate" aria-pressed="true">Award</button>
                <button type="button" data-doc-src="/assets/certificates/cern-gridwars-participation.pdf" data-doc-title="Certificate of Participation" aria-pressed="false">Participation</button>
            </div>
            <button type="button" class="icon-btn" data-doc-close aria-label="Close certificates">
                <i class="fas fa-xmark" aria-hidden="true"></i>
            </button>
        </div>
        <iframe class="doc-dialog__frame" title="Hackathon Award Certificate"></iframe>
        <!-- Shown instead of the frame on devices that cannot display PDFs inline (most phones) -->
        <div class="doc-dialog__fallback" hidden>
            <a class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-up-right-from-square" aria-hidden="true"></i> Open PDF
            </a>
        </div>
    </dialog>
